name: Python CI

on:
  push:
    branches: [ "Python-Dev" ]
  pull_request:
    branches: [ "Python-Dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [stats_visualizer, weather-cli]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"   # ✅ Cache dependencies

    - name: Install project dependencies if available
      working-directory: projects/${{ matrix.project }}
      run: |
        if [ -f requirements.txt ]; then
          pip install --upgrade pip
          pip install -r requirements.txt
        fi

    - name: Install editable package if stats_visualizer
      if: matrix.project == 'stats_visualizer'
      run: pip install -e projects/stats_visualizer

    - name: Run Tests
      working-directory: projects/${{ matrix.project }}
      run: pytest -v
