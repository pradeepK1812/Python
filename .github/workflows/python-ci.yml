name: Python CI

on:
  push:
    branches: [ "Python-Dev" ]
  pull_request:
    branches: [ "Python-Dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [stats_visualizer, weather-cli,dsa]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"   # ✅ Cache dependencies

    - name: Install project dependencies if available
      working-directory: projects/${{ matrix.project }}
      run: |
        if [ -f requirements.txt ]; then
          pip install --upgrade pip
          pip install -r requirements.txt
        fi

    
    - name: Install editable project
      run: pip install -e projects/${{ matrix.project }}

    - name: Add src to PYTHONPATH
      run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/projects/${{ matrix.project }}/src" >> $GITHUB_ENV

    - name: Run Tests
      working-directory: projects/${{ matrix.project }}
      run: pytest -v
